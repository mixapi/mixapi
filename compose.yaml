services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mixapi_test
      POSTGRES_USER: mixapi
      POSTGRES_PASSWORD: mixapi
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mixapi -d mixapi_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - mixapi_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - mixapi_redis_data:/data

volumes:
  mixapi_postgres_data:
  mixapi_redis_data:
