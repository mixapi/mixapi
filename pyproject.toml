[project]
name = "mixapi"
version = "0.1.0"
description = "Unified LLM gateway MVP"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16.0",
  "cryptography>=45.0.0",
  "fastapi>=0.128.0",
  "httpx>=0.28.0",
  "jsonschema>=4.25.0",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic>=2.12.0",
  "pyyaml>=6.0.0",
  "redis>=6.0.0",
  "sqlalchemy>=2.0.0",
  "uvicorn>=0.40.0",
]

[project.scripts]
mixapi = "mixapi.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["mixapi*"]
